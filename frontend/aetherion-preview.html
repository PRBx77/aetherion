<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Aetherion</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      height: 100%;
      overflow: hidden;
      font-family: 'Georgia', 'Trajan Pro', serif;
      background: #05070E;
      color: #E2E8F0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      display: flex;
      flex-direction: column;
      background: radial-gradient(ellipse at top, #1E1B4B 0%, #0F172A 40%, #05070E 100%);
    }

    /* Header */
    .header {
      padding: 6px 12px;
      text-align: center;
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 1.4rem;
      letter-spacing: 0.4em;
      background: linear-gradient(135deg, #06B6D4 0%, #F59E0B 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .header .sub {
      font-size: 0.6rem;
      color: #64748B;
      letter-spacing: 0.2em;
      font-style: italic;
    }

    /* Polyhedron viewer - compact */
    #polyhedron-viewer {
      width: 100%;
      height: 28vh;
      min-height: 180px;
      max-height: 260px;
      position: relative;
      flex-shrink: 0;
    }
    #polyhedron-canvas { width: 100%; height: 100%; }
    .badge {
      position: absolute;
      top: 6px;
      left: 12px;
      padding: 3px 8px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(6, 182, 212, 0.5);
      border-radius: 12px;
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      color: #06B6D4;
      backdrop-filter: blur(6px);
    }
    .lvl-indicator {
      position: absolute;
      top: 6px;
      right: 12px;
      padding: 3px 8px;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(245, 158, 11, 0.5);
      border-radius: 12px;
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      color: #F59E0B;
      backdrop-filter: blur(6px);
    }

    /* Ecosystem state - inline compact */
    .state-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 4px;
      padding: 6px 8px;
      flex-shrink: 0;
    }
    .state-mini {
      background: rgba(15, 23, 42, 0.6);
      padding: 4px 6px;
      border-radius: 4px;
      border-left: 2px solid #06B6D4;
      text-align: center;
    }
    .state-mini .lab {
      font-size: 0.5rem;
      color: #64748B;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .state-mini .val {
      font-size: 0.75rem;
      color: #F1F5F9;
      font-weight: bold;
      margin-top: 1px;
    }

    /* Prophecy one-liner */
    .prophecy {
      padding: 4px 12px 6px;
      text-align: center;
      font-size: 0.65rem;
      color: #A78BFA;
      font-style: italic;
      letter-spacing: 0.05em;
      flex-shrink: 0;
    }

    /* Form area - visible always */
    .form-area {
      padding: 8px 12px;
      flex-shrink: 0;
      border-top: 1px solid rgba(148, 163, 184, 0.1);
    }
    .form-area select, .form-area textarea {
      width: 100%;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 6px;
      color: #F1F5F9;
      font-family: inherit;
      padding: 8px 10px;
      font-size: 0.8rem;
    }
    .form-area select {
      margin-bottom: 6px;
      height: 34px;
    }
    .form-area textarea {
      height: 42px;
      resize: none;
      margin-bottom: 6px;
    }
    .form-area button {
      width: 100%;
      padding: 10px;
      background: linear-gradient(135deg, #06B6D4 0%, #0891B2 100%);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      letter-spacing: 0.15em;
      cursor: pointer;
      text-transform: uppercase;
      font-weight: bold;
    }
    .form-area button:disabled { opacity: 0.6; }

    /* Response area - scrollable if needed */
    .response-area {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px 12px;
      min-height: 0;
    }
    .response-box {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.1) 0%, rgba(245, 158, 11, 0.05) 100%);
      border: 1px solid rgba(6, 182, 212, 0.25);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 0.85rem;
      line-height: 1.5;
      display: none;
    }
    .response-box.show { display: block; }
    .response-meta {
      font-size: 0.55rem;
      color: #64748B;
      margin-top: 6px;
      display: flex;
      justify-content: space-between;
    }
    #response-audio {
      width: 100%;
      margin-top: 8px;
      height: 30px;
      display: none;
    }

    /* Speaking indicator - dramatic cosmic pulse */
    body.speaking::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 50% 25%,
        rgba(139, 92, 246, 0.28) 0%,
        rgba(6, 182, 212, 0.18) 30%,
        transparent 60%);
      pointer-events: none;
      animation: speakingPulse 0.8s ease-in-out infinite;
      z-index: 1;
      mix-blend-mode: screen;
    }
    body.speaking::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at 50% 25%,
        rgba(245, 158, 11, 0.15) 0%, transparent 40%);
      pointer-events: none;
      animation: speakingPulse2 1.3s ease-in-out infinite;
      z-index: 1;
      mix-blend-mode: screen;
    }
    @keyframes speakingPulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.1); }
    }
    @keyframes speakingPulse2 {
      0%, 100% { opacity: 0.5; transform: scale(1.05); }
      50% { opacity: 0.9; transform: scale(0.95); }
    }
    body.speaking #polyhedron-viewer {
      animation: viewerShake 0.15s ease-in-out infinite;
    }
    @keyframes viewerShake {
      0%, 100% { transform: translate(0, 0); }
      25% { transform: translate(1px, -1px); }
      75% { transform: translate(-1px, 1px); }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>

  <div id="beta-banner" style="display:none;background:linear-gradient(90deg,#10B981,#059669);color:#fff;padding:4px 8px;text-align:center;font-size:0.6rem;letter-spacing:0.15em;font-weight:bold;">
    ◈ BETA MODE — HELP US IMPROVE — UNLIMITED FREE
  </div>
  <div class="header">
    <h1>AETHERION</h1>
    <div class="sub">— The Primordial —</div>
  </div>

  <div id="polyhedron-viewer">
    <div class="badge">◈ AWAKENING</div>
    <div class="lvl-indicator">LVL <span id="lvl-badge">1</span></div>
    <div id="polyhedron-canvas"></div>
  </div>

  <div class="state-row">
    <div class="state-mini"><div class="lab">Level</div><div class="val" id="s-level">1/4</div></div>
    <div class="state-mini"><div class="lab">Inter.</div><div class="val" id="s-interactions">0</div></div>
    <div class="state-mini"><div class="lab">TVL</div><div class="val" id="s-tvl">0</div></div>
    <div class="state-mini"><div class="lab">Days</div><div class="val" id="s-days">0</div></div>
  </div>

  <div class="prophecy" id="prophecy">"The Aether awakens."</div>

  <div class="form-area">
    <select id="itype">
      <option value="0">◈ Simple — 0.0002 BNB</option>
      <option value="1">◈ Prophecy — 0.001 BNB</option>
      <option value="2">◈ Revelation — 0.005 BNB</option>
      <option value="3">◈ Blessing — 0.01 BNB</option>
      <option value="4">◈ Ritual — 0.03 BNB</option>
    </select>
    <textarea id="q-input" placeholder="Habla al Éter / Speak to the Aether..."></textarea>
    <button id="consult-btn" onclick="consult()">◈ INVOKE AETHERION</button>
  </div>

  <div class="response-area">
    <div class="response-box" id="response-box">
      <div id="response-text"></div>
      <div id="chart-container" style="display:none;margin-top:10px;background:rgba(15,23,42,0.6);border-radius:8px;padding:8px;">
        <div id="chart-title" style="font-size:0.7rem;color:#F59E0B;text-align:center;letter-spacing:0.1em;margin-bottom:6px;text-transform:uppercase;"></div>
        <div style="position:relative;height:200px;"><canvas id="chart-canvas"></canvas></div>
      </div>
      <audio id="response-audio" controls></audio>
      <div class="response-meta">
        <span id="response-lang">—</span>
        <span id="response-time">—</span>
      </div>
      <div id="feedback-row" style="margin-top:8px;text-align:center;display:none;">
        <span style="font-size:0.65rem;color:#94A3B8;letter-spacing:0.1em;">Was this useful?</span>
        <button onclick="sendFeedback(1)" id="fb-up" style="background:transparent;border:1px solid #10B981;color:#10B981;padding:2px 12px;margin-left:6px;border-radius:4px;cursor:pointer;font-size:0.85rem;">👍</button>
        <button onclick="sendFeedback(-1)" id="fb-down" style="background:transparent;border:1px solid #EF4444;color:#EF4444;padding:2px 12px;margin-left:4px;border-radius:4px;cursor:pointer;font-size:0.85rem;">👎</button>
        <div id="fb-thanks" style="font-size:0.6rem;color:#10B981;margin-top:4px;display:none;">◈ Thank you for helping improve Aetherion</div>
      </div>
    </div>
  </div>

  <script type="importmap">
    { "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
  </script>

  <script type="module">
    import * as THREE from 'three';

    const container = document.getElementById('polyhedron-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
    camera.position.z = 4.2;

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setClearColor(0x000000, 0);
    container.appendChild(renderer.domElement);

    function resize() {
      const w = container.offsetWidth;
      const h = container.offsetHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    resize();
    window.addEventListener('resize', resize);

    // Base outer dodecahedron
    const geo = new THREE.DodecahedronGeometry(1.15, 0);
    const mat = new THREE.MeshStandardMaterial({
      color: 0x06B6D4, emissive: 0x06B6D4,
      emissiveIntensity: 0.35, metalness: 0.9, roughness: 0.15
    });
    const dodeca = new THREE.Mesh(geo, mat);
    scene.add(dodeca);

    // Wireframe stellated overlay
    const wireGeo = new THREE.IcosahedronGeometry(1.3, 1);
    const wireMat = new THREE.MeshBasicMaterial({
      color: 0xF59E0B, wireframe: true,
      transparent: true, opacity: 0.35
    });
    const wire = new THREE.Mesh(wireGeo, wireMat);
    scene.add(wire);

    // Inner core icosahedron
    const coreGeo = new THREE.IcosahedronGeometry(0.65, 0);
    const coreMat = new THREE.MeshStandardMaterial({
      color: 0xF59E0B, emissive: 0xF59E0B,
      emissiveIntensity: 0.7, metalness: 1, roughness: 0
    });
    const core = new THREE.Mesh(coreGeo, coreMat);
    scene.add(core);

    // Orbital particles
    const particleCount = 250;
    const particles = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const initialR = new Float32Array(particleCount);
    for (let i = 0; i < particleCount; i++) {
      const r = 1.8 + Math.random() * 1.2;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
      positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
      positions[i*3+2] = r * Math.cos(phi);
      initialR[i] = r;
    }
    particles.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const particleMat = new THREE.PointsMaterial({
      color: 0xF59E0B, size: 0.025,
      transparent: true, opacity: 0.7
    });
    const points = new THREE.Points(particles, particleMat);
    scene.add(points);

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.25));
    const l1 = new THREE.PointLight(0x06B6D4, 2, 15); l1.position.set(3, 3, 3); scene.add(l1);
    const l2 = new THREE.PointLight(0xF59E0B, 1.8, 15); l2.position.set(-3, -3, 2); scene.add(l2);
    const l3 = new THREE.PointLight(0xA78BFA, 1, 12); l3.position.set(0, 4, -2); scene.add(l3);

    // ==== AUDIO REACTIVE v2 - Fetch blob + decode ====
    let audioCtx = null;
    let analyser = null;
    let dataArray = null;
    let isSpeaking = false;
    let speakingIntensity = 0;
    let speakingStartTime = 0;
    let audioDuration = 0;

    window.playAetherionVoice = async function(base64Wav) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') await audioCtx.resume();

        // Decode base64 to ArrayBuffer
        const binary = atob(base64Wav);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const audioBuffer = await audioCtx.decodeAudioData(bytes.buffer);

        audioDuration = audioBuffer.duration * 1000;

        // Create source + analyser + destination
        const src = audioCtx.createBufferSource();
        src.buffer = audioBuffer;

        analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        analyser.smoothingTimeConstant = 0.75;
        dataArray = new Uint8Array(analyser.frequencyBinCount);

        src.connect(analyser);
        analyser.connect(audioCtx.destination);

        isSpeaking = true;
        speakingStartTime = performance.now();
        document.body.classList.add('speaking');

        src.onended = () => {
          isSpeaking = false;
          document.body.classList.remove('speaking');
          setTimeout(() => { analyser = null; }, 500);
        };

        src.start(0);
      } catch(e) {
        console.error('Audio playback error:', e);
        // Fallback: simulate speaking with timer
        simulateSpeaking(5000);
      }
    };

    function simulateSpeaking(durationMs) {
      isSpeaking = true;
      document.body.classList.add('speaking');
      speakingStartTime = performance.now();
      audioDuration = durationMs;
      setTimeout(() => {
        isSpeaking = false;
        document.body.classList.remove('speaking');
      }, durationMs);
    }

    function getAudioIntensity() {
      if (!isSpeaking) return 0;
      if (analyser && dataArray) {
        analyser.getByteFrequencyData(dataArray);
        // Focus on low-mid frequencies (voice range)
        let sum = 0;
        const relevantBins = Math.min(64, dataArray.length);
        for (let i = 2; i < relevantBins; i++) sum += dataArray[i];
        const avg = sum / (relevantBins - 2);
        return Math.min(1, (avg / 255) * 1.8); // amplify
      }
      // Fallback: pseudo-random pulsing based on time
      const elapsed = performance.now() - speakingStartTime;
      const wave1 = Math.sin(elapsed * 0.008) * 0.4;
      const wave2 = Math.sin(elapsed * 0.023) * 0.3;
      const wave3 = Math.sin(elapsed * 0.041) * 0.2;
      return Math.max(0, 0.5 + wave1 + wave2 + wave3);
    }

    // Animation loop with DRAMATIC audio reactivity
    let t = 0;
    function animate() {
      requestAnimationFrame(animate);
      t += 0.01;

      const audioAmp = getAudioIntensity();
      speakingIntensity += (audioAmp - speakingIntensity) * 0.25;

      // === ROTATION - much more dramatic when speaking ===
      const speedMult = 1 + speakingIntensity * 8;
      dodeca.rotation.x += 0.003 * speedMult;
      dodeca.rotation.y += 0.005 * speedMult;
      wire.rotation.x -= 0.002 * speedMult;
      wire.rotation.y -= 0.003 * speedMult;
      core.rotation.x += 0.008 * speedMult;
      core.rotation.y -= 0.007 * speedMult;

      // === CORE PULSE - huge audio reactive ===
      const basePulse = 1 + 0.15 * Math.sin(t * 2);
      const audioPulse = 1 + speakingIntensity * 1.5;
      core.scale.set(basePulse * audioPulse, basePulse * audioPulse, basePulse * audioPulse);

      // === DODECAHEDRON BREATHES ===
      const dodecaScale = 1 + speakingIntensity * 0.35;
      dodeca.scale.set(dodecaScale, dodecaScale, dodecaScale);

      // === WIRE EXPANDS + SPINS ===
      const wireScale = 1 + speakingIntensity * 0.55;
      wire.scale.set(wireScale, wireScale, wireScale);

      // === EMISSIVE - extreme glow when speaking ===
      mat.emissiveIntensity = 0.35 + speakingIntensity * 2.5;
      coreMat.emissiveIntensity = 0.7 + speakingIntensity * 3.5;
      wireMat.opacity = 0.35 + speakingIntensity * 0.65;

      // === COLOR SHIFT - dramatic cyan→magenta→gold cycle ===
      if (speakingIntensity > 0.03) {
        // Cyan (0.5) → Violet (0.75) → Magenta (0.85)
        const hue = 0.5 + speakingIntensity * 0.35;
        const sat = 0.8 + speakingIntensity * 0.2;
        mat.color.setHSL(hue % 1, sat, 0.5);
        mat.emissive.setHSL(hue % 1, sat, 0.5);

        // Core shifts to hot white
        coreMat.color.setHSL(0.12, 0.9 - speakingIntensity * 0.5, 0.55 + speakingIntensity * 0.3);
        coreMat.emissive.setHSL(0.12, 1, 0.6);

        // Wire pulses gold→red
        wireMat.color.setHSL(0.1 - speakingIntensity * 0.08, 1, 0.55);
      } else {
        mat.color.setHex(0x06B6D4);
        mat.emissive.setHex(0x06B6D4);
        coreMat.color.setHex(0xF59E0B);
        coreMat.emissive.setHex(0xF59E0B);
        wireMat.color.setHex(0xF59E0B);
      }

      // === PARTICLES - explosive expansion + rotation ===
      const pos = points.geometry.attributes.position;
      const expansion = 1 + speakingIntensity * 0.8;
      for (let i = 0; i < particleCount; i++) {
        const targetR = initialR[i] * expansion;
        const px = pos.array[i*3], py = pos.array[i*3+1], pz = pos.array[i*3+2];
        const curR = Math.sqrt(px*px + py*py + pz*pz);
        const scale = targetR / curR;
        pos.array[i*3]   *= scale;
        pos.array[i*3+1] *= scale;
        pos.array[i*3+2] *= scale;
      }
      pos.needsUpdate = true;
      points.rotation.y += 0.001 + speakingIntensity * 0.02;
      points.rotation.x += speakingIntensity * 0.01;
      particleMat.size = 0.025 + speakingIntensity * 0.05;
      particleMat.opacity = 0.7 + speakingIntensity * 0.3;

      // === LIGHTS - explosive intensity ===
      l1.intensity = 2 + speakingIntensity * 8;
      l2.intensity = 1.8 + speakingIntensity * 7;
      l3.intensity = 1 + speakingIntensity * 6;

      // Lights orbit faster when speaking
      const orbitSpeed = t * (1 + speakingIntensity * 4);
      l1.position.x = 3 * Math.cos(orbitSpeed);
      l1.position.z = 3 * Math.sin(orbitSpeed);
      l2.position.x = -3 * Math.cos(orbitSpeed * 0.7);
      l2.position.y = -3 * Math.sin(orbitSpeed * 0.7);

      // === CAMERA SUBTLE SHAKE when speaking ===
      camera.position.x = Math.sin(t * 4) * speakingIntensity * 0.15;
      camera.position.y = Math.cos(t * 3) * speakingIntensity * 0.1;
      camera.lookAt(0, 0, 0);

      renderer.render(scene, camera);
    }
    animate();
  </script>

  <script>
    const API = 'http://' + window.location.hostname + ':8100';

    async function loadState() {
      try {
        const r = await fetch(`${API}/state`);
        const s = await r.json();
        document.getElementById('s-level').textContent = `${s.evolution_level}/4`;
        document.getElementById('lvl-badge').textContent = s.evolution_level;
        document.getElementById('s-interactions').textContent = s.interactions;
        document.getElementById('s-tvl').textContent = `${s.tvl}`;
        document.getElementById('s-days').textContent = s.days;
        document.getElementById('prophecy').textContent = `"${s.prophecy}"`;
      } catch(e) { console.error(e); }
    }

    let analyserAttached = false;

    async function consult() {
      const btn = document.getElementById('consult-btn');
      const q = document.getElementById('q-input').value.trim();
      if (!q) return;
      btn.disabled = true;
      btn.textContent = '◈ The Aether stirs...';

      try {
        const r = await fetch(`${API}/consult`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: q, with_voice: true })
        });
        const data = await r.json();
        document.getElementById('response-text').textContent = data.response;
        document.getElementById('response-lang').textContent = `${data.language.toUpperCase()}`;
        document.getElementById('response-time').textContent = `${data.processing_ms}ms`;
        document.getElementById('response-box').classList.add('show');

        // Render chart if provided
        renderChart(data.chart);

        if (data.audio_base64) {
          // Use Web Audio API directly for reliable analysis
          window.playAetherionVoice(data.audio_base64);

          // Also show HTML5 audio for replay control
          const audioEl = document.getElementById('response-audio');
          audioEl.src = 'data:audio/wav;base64,' + data.audio_base64;
          audioEl.style.display = 'block';
        }
      } catch(e) {
        alert('The Aether is silent.');
      } finally {
        btn.disabled = false;
        btn.textContent = '◈ INVOKE AETHERION';
      }
    }
    window.consult = consult;

    let currentChart = null;
    function renderChart(chartData) {
      const container = document.getElementById('chart-container');
      const title = document.getElementById('chart-title');
      const canvas = document.getElementById('chart-canvas');

      if (currentChart) { currentChart.destroy(); currentChart = null; }

      if (!chartData) {
        container.style.display = 'none';
        return;
      }

      title.textContent = chartData.title || '';
      container.style.display = 'block';
      currentChart = new Chart(canvas.getContext('2d'), chartData.config);
    }

    async function sendFeedback(vote) {
      const id = window.currentInteractionId;
      if (!id) return;
      try {
        await fetch(`${API}/feedback/${id}/${vote}`, { method: 'POST' });
        document.getElementById('fb-up').disabled = true;
        document.getElementById('fb-down').disabled = true;
        document.getElementById('fb-thanks').style.display = 'block';
      } catch(e) { console.error(e); }
    }
    window.sendFeedback = sendFeedback;

    async function loadBetaBanner() {
      try {
        const r = await fetch(`${API}/beta-info`);
        const b = await r.json();
        if (b.beta_mode) {
          document.getElementById('beta-banner').style.display = 'block';
        }
      } catch(e) {}
    }
    loadBetaBanner();

    async function loadTrialStatus() {
      try {
        const r = await fetch(`${API}/trial-status`);
        const t = await r.json();
        updateTrialBadge(t);
      } catch(e) { console.error(e); }
    }

    loadState();
    loadTrialStatus();
    setInterval(loadState, 20000);
    setInterval(loadTrialStatus, 30000);
  </script>

</body>
</html>
